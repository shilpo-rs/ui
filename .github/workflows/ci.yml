name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-contract:
    name: Release Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash .github/scripts/check-pr-title.sh
      - name: Test release contract
        run: bash tests/test_release_contract.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1
      - name: Verify deterministic release notes
        run: bash scripts/release-contract.sh dry-run

  rust:
    name: Rust (fmt, clippy, nextest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        run: rustup show

      - name: Install build dependencies
        run: |
          timeout 5m sudo apt-get update
          timeout 5m sudo apt-get install --yes \
            clang cmake libasound2-dev libdrm-dev libfontconfig1-dev libglib2.0-dev \
            libssl-dev libva-dev libvulkan-dev libwayland-dev libxcb1-dev \
            libxkbcommon-x11-dev libzstd-dev pkg-config

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting
        run: timeout 5m cargo fmt --all -- --check

      - name: Verify clippy lints
        run: timeout 20m cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run workspace tests
        run: timeout 20m cargo nextest run --workspace

      - name: Verify clean worktree
        run: test -z "$(git status --porcelain --untracked-files=all)"

  supply-chain:
    name: Supply Chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - run: timeout 5m cargo deny check bans licenses sources
