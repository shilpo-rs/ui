[package]
name = "shilpo-macros"
description = "Procedural macros (icon generation, plot derive) shared by Shilpo UI design systems."
version = "0.1.0"
license = "Apache-2.0"
publish = true
edition.workspace = true
homepage = "https://github.com/shilpo-rs/ui"
repository = "https://github.com/shilpo-rs/ui"
readme = "README.md"

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = "3"

[package.metadata.cargo-machete]
ignored = ["proc-macro2", "core-text"]
